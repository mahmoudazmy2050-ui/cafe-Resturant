  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصفحة مكبّرة" hidden>

    </div>
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImage" src="pages/page-01.webp" alt="صفحة مكبّرة من منيو Kalamantina" draggable="false">

  </div>

  <div class="qr-overlay" id="qrOverlay" hidden>
